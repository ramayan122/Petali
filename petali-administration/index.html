  const ms = f.mats.filter(m => m.item_id && Number(m.qty) > 0);

async function saveOrder() {
  const f = no; if (!f.name.trim() || !f.phone.trim()) return toast('اكتبي اسم العميل ورقمه'); if (!f.items.length) return toast('أضيفي منتجًا واحدًا على الأقل');

  if (error) return toast(error.message);
  const rows = f.items.map(it => { const p = prodCache.find(x => x.id === it.pid), q = Math.max(1, it.qty | 0); let pc = p.price; if (p.wholesale_price && p.wholesale_min_qty && q >= p.wholesale_min_qty) pc = p.wholesale_price; if (it.gift) pc = 0;
    return { order_id: o.id, product_id: p.id, product_name: p.name, image_path: p.image_path, options: it.opts, quantity: q, unit_price: pc, line_total: pc * q, is_gift: !!it.gift }; });

async function addEntry() {

  if (t === 'income') rows = [{ type: t, account: 'general', amount: m }];

async function fetchAll(t) { let out = [], i = 0; for (;;) { const { data, error } = await sb.from(t).select('*').range(i, i + 999); if (error) throw error; out = out.concat(data); if (data.length < 1000) break; i += 1000; } return out; }
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
const csv = rows => { const k = Object.keys(rows[0]), c = v => `"${String(v == null ? '' : typeof v === 'object' ? JSON.stringify(v) : v).replace(/"/g, '""')}"`; return '\ufeff' + [k.join(','), ...rows.map(r => k.map(x => c(r[x])).join(','))].join('\n'); };
const today = () => new Date().toISOString().slice(0, 10);
async function exportCsv(t) { try { const r = await fetchAll(t); if (!r.length) return toast('لا توجد بيانات'); download(`petali-${t}-${today()}.csv`, csv(r), 'text/csv;charset=utf-8'); } catch (e) { toast(e.message); } }
async function exportAll() {

}
